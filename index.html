<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finora</title><style>
:root{--bg:#0b0e14;--panel:#141923;--panel2:#1b2130;--text:#eef2fa;--muted:#8e9aae;--line:#293243;--accent:#7c5cff;--accent2:#1dd6a7;--danger:#ff627d;--warn:#ffb84d;--radius:16px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#1d1940,transparent 35%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0d111aee;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-size:21px;font-weight:800}.brand i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#b276ff);display:grid;place-items:center;font-style:normal}.nav{display:grid;gap:3px}.nav button{display:flex;align-items:center;gap:11px;text-align:left;background:transparent;color:var(--muted);padding:10px;border-radius:10px}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#28234b,#1a2030);color:#fff}.main{min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:#0b0e14e8;backdrop-filter:blur(14px);z-index:4}.top h1{font-size:19px;margin:0}.actions{display:flex;gap:8px;align-items:center}.key{color:var(--muted);font-size:12px;border:1px solid var(--line);padding:7px 10px;border-radius:8px}.content{padding:28px;max-width:1550px;margin:auto}.btn{background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700}.btn:hover{filter:brightness(1.15)}.btn.soft{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#44212a;color:#ff9aad}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(150px,1fr))}.card{background:linear-gradient(135deg,#181e2aee,#121722ee);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 12px 32px #0002}.stat .label,.label{color:var(--muted);font-size:12px}.stat .val{font-size:24px;font-weight:800;margin:7px 0}.positive{color:var(--accent2)}.negative{color:var(--danger)}.charts{grid-template-columns:2fr 1fr;margin-top:16px}.chart{height:280px}.chart canvas{width:100%;height:210px;margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section-head h2{margin:0;font-size:20px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%}th{text-align:left;color:var(--muted);font-weight:600;font-size:12px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border:0}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#252d3c;color:#cdd6e5}.badge.green{background:#133b35;color:#70eac9}.badge.red{background:#45222c;color:#ffabb8}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,form input,form select,form textarea{background:#0d121b;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;width:100%}.toolbar input{max-width:280px}.progress{height:8px;background:#0c1018;border-radius:9px;overflow:hidden}.progress b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}.budget{display:grid;grid-template-columns:1fr 2fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.budget:last-child{border:0}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:16px}.modal.open{display:grid}.dialog{background:#151b27;border:1px solid #39445b;border-radius:18px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 24px 90px #0008}.dialog.wide{width:min(1050px,100%)}.dialog h2{margin-top:0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.form .full{grid-column:1/-1}.form label{display:grid;gap:6px;color:#acb6c6;font-size:12px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toastbox{position:fixed;right:18px;bottom:18px;z-index:40;display:grid;gap:8px}.toast{background:#202938;border:1px solid #3b4860;border-radius:11px;padding:12px 15px;box-shadow:0 10px 28px #0006;animation:in .25s}.empty{padding:30px;text-align:center;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.invoice{background:#fff;color:#192133;padding:40px;min-height:500px}.invoice h1{color:#5d43db}.invoice table{margin-top:25px}.invoice th,.invoice td{border-color:#dce1e9;color:#192133}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:85px;border:1px solid var(--line);border-radius:9px;padding:7px;color:var(--muted)}.event{font-size:10px;background:#332d63;color:#ddd5ff;padding:3px;border-radius:4px;margin-top:4px;overflow:hidden}.calc-grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.calculator input{margin:10px 0}.hamb{display:none}.muted{color:var(--muted)}@keyframes in{from{transform:translateY(10px);opacity:0}}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;left:-270px;width:250px;z-index:15;transition:.25s}.side.open{left:0}.hamb{display:block}.stats{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.content{padding:18px}.top{padding:0 18px}.top h1{font-size:16px}.form{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.budget{grid-template-columns:1fr}.hide-mobile{display:none}}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}.invoice{display:block!important}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><i>F</i><span id="brand">Finora</span></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div class="actions"><button class="btn soft hamb" onclick="side.classList.toggle('open')">☰</button><h1 id="pageTitle">Dashboard</h1></div><div class="actions"><button class="btn soft" onclick="openSearch()">⌕ <span class="hide-mobile">Szukaj</span> <span class="key">Ctrl K</span></button><button class="btn" onclick="openTransaction()">＋ Transakcja</button></div></header><div class="content" id="view"></div></main></div><div id="modals"></div><div class="toastbox" id="toasts"></div><div id="printArea" style="display:none"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const TAX={2026:{pitFree:30000,threshold:120000,low:.12,high:.32,linear:.19,vat:.23,health:.09,social:1773.96}};
const nav=['Dashboard','Finanse','Transakcje','Przychody','Wydatki','Budżety','Podatki','Faktury','Kontrahenci','Analiza finansowa','Inwestycje','Planowanie','Cele finansowe','Raporty','Kalendarz','Kalkulatory','Ustawienia'];
const fresh=()=>({settings:{name:'Finora',theme:'dark',accent:'#7c5cff',currency:'PLN',company:{name:'',nip:'',address:'',email:'',phone:'',bank:'',logo:''}},accounts:[{id:'a1',name:'Konto główne',balance:0,currency:'PLN',type:'bankowe',description:''}],transactions:[],invoices:[],contacts:[],budgets:[],goals:[],plans:[],investments:[]});let D=JSON.parse(localStorage.getItem('finora-data')||'null'),page='Dashboard';
function save(){localStorage.setItem('finora-data',JSON.stringify(D));render();}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function money(n,c=D.settings.currency){return new Intl.NumberFormat('pl-PL',{style:'currency',currency:c}).format(Number(n||0))}function date(){return new Date().toISOString().slice(0,10)}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;toasts.append(e);setTimeout(()=>e.remove(),3800)}
function modal(title,body,wide=false){modals.innerHTML=`<div class="modal open" id="modal"><div class="dialog ${wide?'wide':''}"><button onclick="closeModal()" style="float:right;background:none;color:white;font-size:21px">×</button><h2>${title}</h2>${body}</div></div>`}function closeModal(){$('#modal')?.remove()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();openTransaction()}if(e.ctrlKey&&e.key.toLowerCase()==='f'){e.preventDefault();openInvoice()}});
function stats(){let tr=D.transactions,inc=tr.filter(x=>x.type==='income').reduce((s,x)=>s+ +x.amount,0),out=tr.filter(x=>x.type==='expense').reduce((s,x)=>s+ +x.amount,0),balance=D.accounts.reduce((s,x)=>s+ +x.balance,0),open=D.invoices.filter(x=>!['opłacona','anulowana'].includes(x.status)).reduce((s,x)=>s+x.total,0);return{inc,out,balance,profit:inc-out,open}}function transactions(q=''){return D.transactions.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()))}
function render(){document.documentElement.style.setProperty('--accent',D.settings.accent);brand.textContent=D.settings.name;document.title=D.settings.name;nav.innerHTML=nav.map(x=>`<button class="${x===page?'active':''}" onclick="go('${x}')"><span>${icon(x)}</span>${x}</button>`).join('');pageTitle.textContent=page;let f={Dashboard:dashboard,Finanse:finances,Transakcje:transactionPage,Przychody:incomePage,Wydatki:expensePage,Budżety:budgets,Podatki:taxes,Faktury:invoices,Kontrahenci:contacts,'Analiza finansowa':analysis,Inwestycje:investments,Planowanie:planning,'Cele finansowe':goals,Raporty:reports,Kalendarz:calendar,Kalkulatory:calculators,Ustawienia:settings}[page];view.innerHTML=f();setTimeout(drawCharts,30)}function go(x){page=x;side.classList.remove('open');render()};function icon(x){return ({Dashboard:'▦',Finanse:'◉',Transakcje:'↕',Przychody:'↑',Wydatki:'↓',Budżety:'◫',Podatki:'%',Faktury:'▤',Kontrahenci:'♙','Analiza finansowa':'◌',Inwestycje:'◈',Planowanie:'◷','Cele finansowe':'◎',Raporty:'▧',Kalendarz:'□',Kalkulatory:'⌘',Ustawienia:'⚙'})[x]}
function dashboard(){let s=stats();return `<div class="section-head"><div><h2>Przegląd finansów</h2><span class="muted">Aktualny obraz Twojej sytuacji finansowej</span></div><button class="btn soft" onclick="go('Raporty')">Eksport raportu</button></div><div class="grid stats">${[['Aktualne saldo',s.balance],['Przychody',s.inc],['Wydatki',s.out],['Zysk',s.profit],['Oszczędności',Math.max(0,s.profit)],['Należności',s.open],['Budżety',D.budgets.length],['Cele finansowe',D.goals.length]].map(([l,v])=>`<div class="card stat"><div class="label">${l}</div><div class="val ${v<0?'negative':'positive'}">${typeof v==='number'?money(v):v}</div></div>`).join('')}</div><div class="grid charts"><div class="card chart"><b>Przychody i wydatki</b><canvas id="chart1"></canvas></div><div class="card"><b>Wydatki według kategorii</b><div id="catList" style="margin-top:14px"></div></div><div class="card chart"><b>Cash flow i prognoza salda</b><canvas id="chart2"></canvas></div><div class="card"><b>Nadchodzące płatności</b>${upcoming()}</div></div>`}function upcoming(){let a=[...D.plans].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);return a.length?a.map(x=>`<div class="budget"><span>${esc(x.name)}<br><small class="muted">${x.date}</small></span><b>${money(x.amount)}</b></div>`).join(''):'<p class="empty">Brak zaplanowanych wydatków</p>'}
function finances(){return `<div class="section-head"><div><h2>Konta i środki</h2><span class="muted">Transfery rozliczają salda automatycznie.</span></div><button class="btn" onclick="openAccount()">＋ Konto</button></div><div class="grid stats">${D.accounts.map(a=>`<div class="card stat"><div class="label">${esc(a.type)} · ${esc(a.currency)}</div><div class="val">${money(a.balance,a.currency)}</div><b>${esc(a.name)}</b><p class="muted">${esc(a.description||'—')}</p><button class="btn soft" onclick="openAccount('${a.id}')">Edytuj</button></div>`).join('')}</div>`}
function txRows(list){return list.length?list.map(t=>`<tr><td>${t.date}</td><td><span class="badge ${t.type==='income'?'green':t.type==='expense'?'red':''}">${t.type==='income'?'Przychód':t.type==='expense'?'Wydatek':'Transfer'}</span></td><td>${esc(t.category||'—')}</td><td>${esc(t.description||t.counterparty||'—')}</td><td class="${t.type==='expense'?'negative':'positive'}">${t.type==='expense'?'−':t.type==='income'?'+':'↔'} ${money(t.amount)}</td><td><button class="btn soft" onclick="openTransaction('${t.id}')">Edytuj</button> <button class="btn soft" onclick="duplicateTx('${t.id}')">Duplikuj</button> <button class="btn danger" onclick="deleteTx('${t.id}')">×</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Brak transakcji</td></tr>'}function transactionPage(){return `<div class="section-head"><div><h2>Transakcje</h2><span class="muted">Historia operacji finansowych</span></div><button class="btn" onclick="openTransaction()">＋ Nowa transakcja</button></div><div class="card"><div class="toolbar"><input placeholder="Szukaj opisu, kategorii, kontrahenta..." oninput="filterTx(this.value)"><button class="btn soft" onclick="exportData('transactions','csv')">Eksport CSV</button><button class="btn soft" onclick="exportData('transactions','json')">JSON</button></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Typ</th><th>Kategoria</th><th>Opis</th><th>Kwota</th><th>Akcje</th></tr></thead><tbody id="txbody">${txRows(D.transactions)}</tbody></table></div></div>`}function filterTx(q){txbody.innerHTML=txRows(transactions(q))}
function incomePage(){return typedPage('income','Przychody','Źródła przychodów, także prognozowane i cykliczne')}function expensePage(){return typedPage('expense','Wydatki','Kontroluj wszystkie koszty i ich kategorie')}function typedPage(type,title,sub){let list=D.transactions.filter(x=>x.type===type),total=list.reduce((a,x)=>a+ +x.amount,0);return `<div class="section-head"><div><h2>${title}</h2><span class="muted">${sub}</span></div><button class="btn" onclick="openTransaction('', '${type}')">＋ Dodaj</button></div><div class="card stat"><div class="label">Suma</div><div class="val ${type==='income'?'positive':'negative'}">${money(total)}</div></div><div class="card" style="margin-top:16px"><table><thead><tr><th>Data</th><th>Kategoria</th><th>Opis</th><th>Kwota</th><th></th></tr></thead><tbody>${txRows(list)}</tbody></table></div>`}
function budgets(){let now=new Date().toISOString().slice(0,7);return `<div class="section-head"><div><h2>Budżety</h2><span class="muted">Alerty progowe: 50%, 75%, 90% i 100%.</span></div><button class="btn" onclick="openBudget()">＋ Budżet</button></div><div class="card">${D.budgets.length?D.budgets.map(b=>{let spent=D.transactions.filter(t=>t.type==='expense'&&t.category===b.category&&t.date.startsWith(now)).reduce((s,t)=>s+ +t.amount,0),p=Math.min(100,spent/b.limit*100);return `<div class="budget"><div><b>${esc(b.name)}</b><br><small class="muted">${esc(b.category)} · ${esc(b.period)}</small></div><div><div class="progress"><b style="width:${p}%"></b></div><small>${money(spent)} z ${money(b.limit)} (${p.toFixed(0)}%)</small></div><div><b class="${spent>b.limit?'negative':''}">${money(b.limit-spent)}</b><br><button class="btn danger" onclick="remove('budgets','${b.id}')">Usuń</button></div></div>`}).join(''):'<div class="empty">Utwórz pierwszy budżet kategorii.</div>'}</div>`}
function taxes(){return `<div class="section-head"><div><h2>Kalkulator podatkowy</h2><span class="muted">Wynik ma charakter orientacyjny i nie stanowi porady podatkowej.</span></div></div><div class="card"><div class="form"><label>Rok<select id="taxYear"><option>2026</option></select></label><label>Forma<select id="taxType"><option value="scale">Skala podatkowa</option><option value="linear">Podatek liniowy</option><option value="ryczalt">Ryczałt</option></select></label><label>Przychód<input id="taxRevenue" type="number" min="0" value="100000"></label><label>Koszty<input id="taxCosts" type="number" min="0" value="20000"></label><label>Stawka ryczałtu %<input id="taxRate" type="number" min="0" max="100" value="12"></label></div><p><button class="btn" onclick="calcTax()">Oblicz podatek</button></p><div id="taxResult" class="kpis"></div></div>`}
function invoices(){return `<div class="section-head"><div><h2>Faktury</h2><span class="muted">Wystawiaj, śledź i drukuj dokumenty sprzedaży.</span></div><button class="btn" onclick="openInvoice()">＋ Nowa faktura</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Numer</th><th>Kontrahent</th><th>Termin</th><th>Kwota</th><th>Status</th><th></th></tr></thead><tbody>${D.invoices.length?D.invoices.map(i=>`<tr><td><b>${esc(i.number)}</b></td><td>${esc(i.buyer)}</td><td>${i.due}</td><td>${money(i.total,i.currency)}</td><td><span class="badge ${i.status==='opłacona'?'green':i.status==='przeterminowana'?'red':''}">${i.status}</span></td><td><button class="btn soft" onclick="previewInvoice('${i.id}')">Podgląd</button> <button class="btn soft" onclick="editInvoice('${i.id}')">Edytuj</button><button class="btn danger" onclick="remove('invoices','${i.id}')">×</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Brak faktur</td></tr>'}</tbody></table></div></div>`}
function contacts(){return `<div class="section-head"><div><h2>Kontrahenci</h2><span class="muted">Firmy i osoby z historią dokumentów.</span></div><button class="btn" onclick="openContact()">＋ Kontrahent</button></div><div class="grid stats">${D.contacts.map(c=>{let inv=D.invoices.filter(i=>i.buyer===c.name),sum=inv.filter(i=>i.status!=='opłacona').reduce((x,i)=>x+i.total,0);return `<div class="card"><b>${esc(c.name)}</b><p class="muted">NIP: ${esc(c.nip||'—')}<br>${esc(c.email||'—')} · ${esc(c.phone||'—')}</p><div class="label">Należności: <b>${money(sum)}</b> · Faktury: ${inv.length}</div><p><button class="btn soft" onclick="openContact('${c.id}')">Edytuj</button> <button class="btn danger" onclick="remove('contacts','${c.id}')">Usuń</button></p></div>`}).join('')||'<div class="card empty">Dodaj pierwszego kontrahenta.</div>'}</div>`}
function analysis(){let s=stats(), cats=Object.entries(categoryTotals('expense')).sort((a,b)=>b[1]-a[1]);let msg=cats.length?`Największa kategoria wydatków: <b>${esc(cats[0][0])}</b> (${money(cats[0][1])}).`:'Dodaj transakcje, aby zobaczyć analizę opartą na danych.';return `<div class="section-head"><div><h2>Analiza finansowa</h2><span class="muted">Wnioski są generowane wyłącznie na podstawie zapisanych danych.</span></div></div><div class="grid kpis"><div class="card"><span class="label">Cash flow</span><h2 class="${s.profit<0?'negative':'positive'}">${money(s.profit)}</h2></div><div class="card"><span class="label">Stopa oszczędności</span><h2>${s.inc?Math.max(0,s.profit/s.inc*100).toFixed(1):0}%</h2></div><div class="card"><span class="label">Należności</span><h2>${money(s.open)}</h2></div></div><div class="card" style="margin-top:16px"><h3>Najważniejszy sygnał</h3><p>${msg}</p><p class="muted">Trend przychodów: ${s.inc?'dane z '+D.transactions.filter(x=>x.type==='income').length+' transakcji':'brak danych'} · Trend wydatków: ${s.out?'dane z '+D.transactions.filter(x=>x.type==='expense').length+' transakcji':'brak danych'}</p></div>`}
function investments(){let inv=D.investments[0]||{capital:10000,monthly:500,years:10,rate:7};return `<div class="section-head"><div><h2>Planer inwestycyjny</h2><span class="muted">Symulacje nie są gwarantowanymi wynikami inwestycyjnymi.</span></div><button class="btn" onclick="saveInvestment()">Zapisz plan</button></div><div class="card"><div class="form"><label>Kapitał początkowy<input id="ic" type="number" min="0" value="${inv.capital}"></label><label>Regularna wpłata miesięczna<input id="im" type="number" min="0" value="${inv.monthly}"></label><label>Okres (lata)<input id="iy" type="number" min="1" value="${inv.years}"></label><label>Stopa zwrotu rocznie %<input id="ir" type="number" min="0" max="100" value="${inv.rate}"></label></div><p><button class="btn soft" onclick="investmentCalc()">Przelicz scenariusze</button></p><div id="investResult" class="grid kpis"></div></div>`}
function planning(){return `<div class="section-head"><div><h2>Planowanie wydatków</h2><span class="muted">Przyszłe płatności są uwzględniane w prognozie salda.</span></div><button class="btn" onclick="openPlan()">＋ Zaplanuj wydatek</button></div><div class="card"><div class="label">Przewidywane saldo po zaplanowanych wydatkach</div><h2>${money(stats().balance-D.plans.reduce((s,x)=>s+ +x.amount,0))}</h2>${upcoming()}</div>`}
function goals(){return `<div class="section-head"><div><h2>Cele finansowe</h2><span class="muted">Monitoruj postęp i planowaną datę realizacji.</span></div><button class="btn" onclick="openGoal()">＋ Cel</button></div><div class="grid stats">${D.goals.map(g=>{let p=Math.min(100,g.current/g.target*100),rem=g.target-g.current;return `<div class="card"><b>${esc(g.name)}</b><h2>${money(g.current)} <small class="muted">/ ${money(g.target)}</small></h2><div class="progress"><b style="width:${p}%"></b></div><p>${p.toFixed(0)}% · Brakuje ${money(rem)}</p><small class="muted">Planowana data: ${g.date||'nie określono'}</small><p><button class="btn soft" onclick="openGoal('${g.id}')">Edytuj</button><button class="btn danger" onclick="remove('goals','${g.id}')">Usuń</button></p></div>`}).join('')||'<div class="card empty">Utwórz cel, np. Poduszka finansowa.</div>'}</div>`}
function reports(){return `<div class="section-head"><div><h2>Raporty</h2><span class="muted">Generowanie na podstawie lokalnych danych.</span></div></div><div class="grid stats">${['Miesięczny','Kwartalny','Roczny','Przychodów','Wydatków','Podatkowy','Cash flow','Budżetu'].map(x=>`<div class="card"><b>Raport ${x}</b><p class="muted">Zestawienie finansowe</p><button class="btn soft" onclick="report('${x}','csv')">CSV</button> <button class="btn" onclick="report('${x}','print')">PDF / druk</button></div>`).join('')}</div>`}
let calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);function moveCalendar(step){let min=new Date(new Date().getFullYear()-1,0,1),max=new Date(new Date().getFullYear()+20,11,1),next=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+step,1);if(next<min||next>max){toast('Dostępny zakres: rok wstecz do 20 lat naprzód');return}calendarCursor=next;render()}function openCalendarEvent(day=''){let min=new Date().getFullYear()-1,max=new Date().getFullYear()+20;modal('Dodaj wydarzenie do kalendarza',`<form class="form" onsubmit="saveCalendarEvent(event)"><label>Nazwa<input name="name" required maxlength="100" placeholder="np. Spotkanie z klientem"></label><label>Rodzaj<select name="type"><option>Spotkanie</option><option>Wydatek</option><option>Przychód</option><option>Płatność</option><option>Podatek</option><option>Rata</option><option>Przypomnienie</option><option>Inne</option></select></label><label>Data<input name="date" type="date" required min="${min}-01-01" max="${max}-12-31" value="${day||date()}"></label><label>Kwota (opcjonalnie)<input name="amount" type="number" min="0" step="0.01"></label><label class="full">Notatka<textarea name="note" maxlength="500" placeholder="Dodatkowe informacje"></textarea></label><div class="full form-actions"><button type="button" class="btn soft" onclick="closeModal()">Anuluj</button><button class="btn">Zapisz wydarzenie</button></div></form>`)}function saveCalendarEvent(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.amount=x.amount?+x.amount:0;(D.calendarEvents||(D.calendarEvents=[])).push({...x,id:uid()});save();closeModal();toast('Wydarzenie zapisane w kalendarzu')}function deleteCalendarEvent(id){D.calendarEvents=(D.calendarEvents||[]).filter(x=>x.id!==id);save();toast('Usunięto wydarzenie')}function calendar(){let d=calendarCursor,year=d.getFullYear(),mo=d.getMonth(),first=new Date(year,mo,1).getDay()||7,days=new Date(year,mo+1,0).getDate(),events=[...D.plans.map(x=>({...x,label:'Wydatek'})),...D.transactions.map(x=>({...x,label:x.type==='income'?'Przychód':'Płatność'})),...D.invoices.map(x=>({date:x.due,name:x.number,label:'Faktura'})),...(D.calendarEvents||[]).map(x=>({...x,label:x.type,custom:true}))];return `<div class="section-head"><div><h2>Kalendarz finansowy</h2><span class="muted">Kliknij dzień, aby dodać wydarzenie · zakres ${new Date().getFullYear()-1}–${new Date().getFullYear()+20}</span></div><div class="actions"><button class="btn" onclick="openCalendarEvent()">＋ Wydarzenie</button><button class="btn soft" onclick="moveCalendar(-12)">‹ Rok</button><button class="btn soft" onclick="moveCalendar(-1)">‹ Miesiąc</button><button class="btn soft" onclick="calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()">Dzisiaj</button><button class="btn soft" onclick="moveCalendar(1)">Miesiąc ›</button><button class="btn soft" onclick="moveCalendar(12)">Rok ›</button></div></div><div class="card"><h3 style="margin-top:0;text-transform:capitalize">${new Intl.DateTimeFormat('pl-PL',{month:'long',year:'numeric'}).format(d)}</h3><div class="calendar">${['Pon','Wt','Śr','Czw','Pt','Sob','Nie'].map(x=>`<b class="muted">${x}</b>`).join('')}${Array(first-1).fill('<div></div>').join('')}${Array.from({length:days},(_,i)=>{let dt=`${year}-${String(mo+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,e=events.filter(x=>x.date===dt);return `<div class="day" onclick="openCalendarEvent('${dt}')" title="Dodaj wydarzenie"><b>${i+1} ＋</b>${e.map(x=>`<div class="event" onclick="event.stopPropagation();${x.custom?`deleteCalendarEvent('${x.id}')`:''}" title="${esc(x.name||x.description||'')} ${x.custom?'· kliknij aby usunąć':''}">${esc(x.label)}: ${esc(x.name||x.description||'')}${x.amount?` (${money(x.amount)})`:''}</div>`).join('')}</div>`}).join('')}</div></div>`}
function calculators(){let card=(n,a,b,fn)=>`<div class="card calculator"><b>${n}</b><input id="${a}" type="number" min="0" placeholder="${b}"><button class="btn soft" onclick="${fn}">Oblicz</button><p id="r${a}" class="positive"></p></div>`;return `<div class="section-head"><div><h2>Kalkulatory</h2><span class="muted">Niezależne narzędzia finansowe.</span></div></div><div class="grid calc-grid">${card('VAT (netto)','vat','Kwota netto','calcVAT()')}${card('Marża (%)','margin','Cena zakupu','calcMargin()')}<div class="card calculator"><b>Marża / narzut</b><input id="sale" type="number" min="0" placeholder="Cena sprzedaży"><button class="btn soft" onclick="calcMargin()">Oblicz</button><p id="rmargin" class="positive"></p></div>${card('Procent z liczby','percent','Liczba','calcPercent()')}<div class="card calculator"><b>Procent składany</b><input id="compound" type="number" min="0" placeholder="Kapitał"><input id="compoundRate" type="number" min="0" max="100" placeholder="Stopa %"><input id="compoundYears" type="number" min="0" placeholder="Lata"><button class="btn soft" onclick="calcCompound()">Oblicz</button><p id="rcompound" class="positive"></p></div><div class="card calculator"><b>Raty kredytu</b><input id="loan" type="number" min="0" placeholder="Kwota"><input id="loanRate" type="number" min="0" placeholder="Oprocentowanie %"><input id="loanMonths" type="number" min="1" placeholder="Liczba rat"><button class="btn soft" onclick="calcLoan()">Oblicz</button><p id="rloan" class="positive"></p></div></div>`}
function settings(){let s=D.settings,c=s.company;return `<div class="section-head"><div><h2>Ustawienia</h2><span class="muted">Aplikacja, wygląd, firma oraz bezpieczny backup lokalnych danych.</span></div></div><div class="card"><form class="form" onsubmit="saveSettings(event)"><label>Nazwa aplikacji<input name="name" required value="${esc(s.name)}"></label><label>Waluta<select name="currency">${['PLN','EUR','USD','GBP','CHF'].map(x=>`<option ${s.currency===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Kolor główny<input name="accent" type="color" value="${s.accent}"></label><label>Nazwa firmy<input name="companyName" value="${esc(c.name)}"></label><label>NIP<input name="nip" value="${esc(c.nip)}"></label><label>REGON<input name="regon" value="${esc(c.regon||'')}"></label><label>Adres<textarea name="address">${esc(c.address)}</textarea></label><label>Email<input name="email" type="email" value="${esc(c.email)}"></label><label>Telefon<input name="phone" value="${esc(c.phone)}"></label><label>Konto bankowe<input name="bank" value="${esc(c.bank)}"></label><div class="full"><button class="btn">Zapisz ustawienia</button></div></form></div><div class="card" style="margin-top:16px"><h3>Backup</h3><button class="btn soft" onclick="backup()">Eksportuj backup</button> <button class="btn" onclick="document.getElementById('restore').click()">Importuj backup</button><input id="restore" type="file" accept="application/json" style="display:none" onchange="restore(this)"></div>`}
function openTransaction(id='',preset=''){let t=D.transactions.find(x=>x.id===id)||{type:preset||'expense',amount:'',date:date(),category:'',account:D.accounts[0]?.id||'',toAccount:'',description:'',counterparty:'',document:'',tags:'',note:''};modal(id?'Edytuj transakcję':'Nowa transakcja',`<form class="form" onsubmit="saveTx(event,'${id}')"><label>Typ<select name="type" id="txType" onchange="toggleTransfer()"><option value="income" ${t.type==='income'?'selected':''}>Przychód</option><option value="expense" ${t.type==='expense'?'selected':''}>Wydatek</option><option value="transfer" ${t.type==='transfer'?'selected':''}>Transfer</option></select></label><label>Kwota<input name="amount" type="number" min="0.01" step="0.01" required value="${t.amount}"></label><label>Data<input name="date" type="date" required value="${t.date}"></label><label>Kategoria<input name="category" required value="${esc(t.category)}"></label><label>Konto<select name="account">${D.accounts.map(a=>`<option value="${a.id}" ${a.id===t.account?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label id="toAccount">Konto docelowe<select name="toAccount"><option value="">Wybierz konto</option>${D.accounts.map(a=>`<option value="${a.id}" ${a.id===t.toAccount?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label>Opis<input name="description" value="${esc(t.description)}"></label><label>Kontrahent<input name="counterparty" value="${esc(t.counterparty)}"></label><label>Numer dokumentu<input name="document" value="${esc(t.document)}"></label><label>Tagi<input name="tags" value="${esc(t.tags)}"></label><label class="full">Notatka<textarea name="note">${esc(t.note)}</textarea></label><div class="full form-actions"><button type="button" class="btn soft" onclick="closeModal()">Anuluj</button><button class="btn">Zapisz</button></div></form>`);toggleTransfer()}
function toggleTransfer(){let e=$('#toAccount');if(e)e.style.display=$('#txType').value==='transfer'?'grid':'none'}function saveTx(e,id){e.preventDefault();let x=Object.fromEntries(new FormData(e.target)),amt=+x.amount;if(!amt||amt<0){toast('Podaj prawidłową kwotę');return}if(x.type==='transfer'&&(!x.toAccount||x.toAccount===x.account)){toast('Wybierz inne konto docelowe');return}if(id){let old=D.transactions.find(t=>t.id===id);applyTx(old,-1);Object.assign(old,x,{amount:amt});applyTx(old,1)}else{let t={...x,id:uid(),amount:amt};D.transactions.unshift(t);applyTx(t,1)}save();closeModal();toast('Transakcja zapisana')}
function applyTx(t,k){let a=D.accounts.find(a=>a.id===t.account),to=D.accounts.find(a=>a.id===t.toAccount);if(t.type==='income'&&a)a.balance+=k*t.amount;if(t.type==='expense'&&a)a.balance-=k*t.amount;if(t.type==='transfer'){if(a)a.balance-=k*t.amount;if(to)to.balance+=k*t.amount}}function deleteTx(id){let t=D.transactions.find(x=>x.id===id);if(confirm('Usunąć transakcję?')){applyTx(t,-1);D.transactions=D.transactions.filter(x=>x.id!==id);save();toast('Usunięto transakcję')}}function duplicateTx(id){let t=D.transactions.find(x=>x.id===id);let n={...t,id:uid(),date:date()};D.transactions.unshift(n);applyTx(n,1);save();toast('Transakcja zduplikowana')}
function openAccount(id=''){let a=D.accounts.find(x=>x.id===id)||{name:'',balance:0,currency:D.settings.currency,type:'bankowe',description:''};modal(id?'Edytuj konto':'Nowe konto',`<form class="form" onsubmit="saveAccount(event,'${id}')"><label>Nazwa<input name="name" required value="${esc(a.name)}"></label><label>Typ<select name="type">${['bankowe','gotówka','oszczędnościowe','inwestycyjne'].map(x=>`<option ${a.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Saldo początkowe<input name="balance" type="number" required value="${a.balance}"></label><label>Waluta<select name="currency">${['PLN','EUR','USD','GBP','CHF'].map(x=>`<option ${a.currency===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Opis<textarea name="description">${esc(a.description)}</textarea></label><div class="full form-actions"><button class="btn">Zapisz</button></div></form>`)}function saveAccount(e,id){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.balance=+x.balance;if(id)Object.assign(D.accounts.find(a=>a.id===id),x);else D.accounts.push({...x,id:uid()});save();closeModal();toast('Konto zapisane')}
function openBudget(){modal('Nowy budżet',`<form class="form" onsubmit="saveSimple(event,'budgets')"><label>Nazwa<input name="name" required></label><label>Kategoria<input name="category" required></label><label>Limit<input name="limit" type="number" min="0.01" required></label><label>Okres<select name="period"><option>miesięczny</option><option>kwartalny</option><option>roczny</option></select></label><div class="full form-actions"><button class="btn">Utwórz budżet</button></div></form>`)}function openContact(id=''){let c=D.contacts.find(x=>x.id===id)||{};modal(id?'Edytuj kontrahenta':'Nowy kontrahent',`<form class="form" onsubmit="saveContact(event,'${id}')"><label>Nazwa<input name="name" required value="${esc(c.name)}"></label><label>NIP<input name="nip" value="${esc(c.nip)}"></label><label>Adres<textarea name="address">${esc(c.address)}</textarea></label><label>Email<input type="email" name="email" value="${esc(c.email)}"></label><label>Telefon<input name="phone" value="${esc(c.phone)}"></label><label>Konto<input name="bank" value="${esc(c.bank)}"></label><label class="full">Notatka<textarea name="note">${esc(c.note)}</textarea></label><div class="full form-actions"><button class="btn">Zapisz</button></div></form>`)}function saveContact(e,id){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(id)Object.assign(D.contacts.find(c=>c.id===id),x);else D.contacts.push({...x,id:uid()});save();closeModal();toast('Kontrahent zapisany')}
function openPlan(){modal('Zaplanuj wydatek',`<form class="form" onsubmit="saveSimple(event,'plans')"><label>Nazwa<input name="name" required></label><label>Kwota<input name="amount" type="number" min="0.01" required></label><label>Data<input name="date" type="date" min="${date()}" required value="${date()}"></label><label>Kategoria<input name="category" required></label><label>Priorytet<select name="priority"><option>niski</option><option>średni</option><option>wysoki</option></select></label><label>Cykliczność<select name="recurrence"><option>jednorazowo</option><option>miesięcznie</option><option>rocznie</option></select></label><div class="full form-actions"><button class="btn">Zapisz</button></div></form>`)}function openGoal(id=''){let g=D.goals.find(x=>x.id===id)||{name:'',current:0,target:'',date:''};modal(id?'Edytuj cel':'Nowy cel',`<form class="form" onsubmit="saveGoal(event,'${id}')"><label>Nazwa<input name="name" required value="${esc(g.name)}"></label><label>Kwota docelowa<input name="target" type="number" min="0.01" required value="${g.target}"></label><label>Aktualna kwota<input name="current" type="number" min="0" required value="${g.current}"></label><label>Planowana data<input name="date" type="date" value="${g.date}"></label><div class="full form-actions"><button class="btn">Zapisz cel</button></div></form>`)}function saveGoal(e,id){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.target=+x.target;x.current=+x.current;if(id)Object.assign(D.goals.find(g=>g.id===id),x);else D.goals.push({...x,id:uid()});save();closeModal();toast('Cel zapisany')}
function saveSimple(e,key){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));for(let k of ['amount','limit'])if(x[k])x[k]=+x[k];D[key].push({...x,id:uid()});save();closeModal();toast('Zapisano pomyślnie')}function remove(key,id){if(confirm('Czy na pewno usunąć element?')){D[key]=D[key].filter(x=>x.id!==id);save();toast('Usunięto')}}
function openInvoice(){let number=`FV/${new Date().getFullYear()}/${String(D.invoices.length+1).padStart(3,'0')}`;modal('Nowa faktura',`<form class="form" onsubmit="saveInvoice(event)"><label>Numer<input name="number" required value="${number}"></label><label>Nabywca<input name="buyer" list="buyers" required><datalist id="buyers">${D.contacts.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></label><label>Data wystawienia<input name="issued" type="date" required value="${date()}"></label><label>Data sprzedaży<input name="saleDate" type="date" required value="${date()}"></label><label>Termin płatności<input name="due" type="date" required value="${date()}"></label><label>Metoda płatności<select name="method"><option>przelew</option><option>gotówka</option><option>karta</option></select></label><label>Waluta<select name="currency"><option>PLN</option><option>EUR</option><option>USD</option></select></label><label>Status<select name="status"><option>robocza</option><option>wystawiona</option><option>wysłana</option><option>opłacona</option><option>przeterminowana</option><option>anulowana</option></select></label><div class="full"><h3>Pozycje</h3><div id="items"><div class="form item"><label>Nazwa<input name="itemName" required></label><label>Ilość<input name="qty" type="number" min="0.01" step=".01" value="1"></label><label>Jednostka<input name="unit" value="szt."></label><label>Cena netto<input name="price" type="number" min="0" step=".01" required></label><label>VAT %<input name="vat" type="number" min="0" max="100" value="23"></label></div></div></div><div class="full form-actions"><button class="btn">Utwórz fakturę</button></div></form>`,true)}function saveInvoice(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target)),qty=+x.qty,price=+x.price,vat=+x.vat;if(!qty||price<0){toast('Uzupełnij prawidłową pozycję');return}x.items=[{name:x.itemName,qty,unit:x.unit,price,vat,net:qty*price,gross:qty*price*(1+vat/100)}];x.total=x.items[0].gross;x.id=uid();D.invoices.unshift(x);save();closeModal();toast('Faktura utworzona')}
function previewInvoice(id){let i=D.invoices.find(x=>x.id===id),c=D.settings.company,contact=D.contacts.find(x=>x.name===i.buyer)||{};let html=`<div class="invoice"><div style="display:flex;justify-content:space-between"><div><h1>FAKTURA</h1><h2>${esc(i.number)}</h2></div><div><b>${esc(c.name||D.settings.name)}</b><br>${esc(c.address||'')}<br>NIP: ${esc(c.nip||'—')}<br>${esc(c.email||'')}</div></div><hr><div style="display:flex;justify-content:space-between"><div><b>Nabywca</b><br>${esc(i.buyer)}<br>${esc(contact.address||'')}<br>NIP: ${esc(contact.nip||'—')}</div><div>Data wystawienia: ${i.issued}<br>Data sprzedaży: ${i.saleDate}<br>Termin płatności: ${i.due}<br>Płatność: ${i.method}</div></div><table><thead><tr><th>Pozycja</th><th>Ilość</th><th>Netto</th><th>VAT</th><th>Brutto</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.net,i.currency)}</td><td>${x.vat}%</td><td>${money(x.gross,i.currency)}</td></tr>`).join('')}</tbody></table><h2 style="text-align:right">Razem: ${money(i.total,i.currency)}</h2><p>Rachunek bankowy: ${esc(c.bank||'—')}</p><small>Dziękujemy za współpracę.</small></div>`;modal(`Faktura ${i.number}`,html+`<div class="form-actions"><button class="btn soft" onclick="printInvoice('${id}')">Podgląd / Drukuj</button><button class="btn" onclick="printInvoice('${id}')">Generuj PDF</button></div>`,true)}function printInvoice(id){let i=D.invoices.find(x=>x.id===id);let old=$('#printArea').innerHTML;closeModal();previewInvoice(id);let inv=$('.invoice').outerHTML;closeModal();printArea.innerHTML=inv;window.print();printArea.innerHTML=old}
function editInvoice(id){toast('Edycja statusu i danych jest dostępna po utworzeniu nowej korekty; zachowaj integralność dokumentu.');previewInvoice(id)}
function calcTax(){let t=TAX[+taxYear.value],r=+taxRevenue.value,c=+taxCosts.value,base=Math.max(0,r-c),tax=taxType.value==='linear'?base*t.linear:taxType.value==='ryczalt'?r*(+taxRate.value/100):Math.max(0,Math.min(base,t.threshold)*t.low-Math.min(base,t.pitFree)*t.low+Math.max(0,base-t.threshold)*t.high),social=t.social,health=base*t.health,net=r-c-tax-social-health;taxResult.innerHTML=[['Dochód',base],['Podstawa',base],['Podatek',tax],['Składki',social+health],['Netto',net],['Efektywna stopa',r?((tax+social+health)/r*100).toFixed(1)+'%':'0%']].map(x=>`<div class="card"><span class="label">${x[0]}</span><h3>${typeof x[1]==='number'?money(x[1]):x[1]}</h3></div>`).join('')}
function investmentCalc(){let c=+ic.value,m=+im.value,y=+iy.value,r=+ir.value/100,n=y*12,calc=rate=>c*Math.pow(1+rate/12,n)+m*((Math.pow(1+rate/12,n)-1)/(rate/12||1)),out=[['Pesymistyczny',Math.max(0,r-.03)],['Bazowy',r],['Optymistyczny',r+.03]].map(([n,x])=>{let v=calc(x),paid=c+m*y*12;return `<div class="card"><span class="label">${n}</span><h2>${money(v)}</h2><span class="positive">Zysk: ${money(v-paid)} · ${(v/paid*100-100).toFixed(1)}%</span></div>`});investResult.innerHTML=out.join('')}function saveInvestment(){D.investments=[{capital:+ic.value,monthly:+im.value,years:+iy.value,rate:+ir.value}];save();toast('Plan inwestycyjny zapisany')}
function calcVAT(){rvat.textContent='Brutto: '+money(+vat.value*1.23)+' · VAT: '+money(+vat.value*.23)}function calcMargin(){let c=+margin.value,s=+sale.value;rmargin.textContent=s&&c?'Marża: '+((s-c)/s*100).toFixed(2)+'% · Narzut: '+((s-c)/c*100).toFixed(2)+'%':'Podaj cenę zakupu i sprzedaży'}function calcPercent(){rpercent.textContent='Wynik dla 10%: '+money(+percent.value*.1)}function calcCompound(){rcompound.textContent='Wartość: '+money(+compound.value*Math.pow(1+(+compoundRate.value/100),+compoundYears.value))}function calcLoan(){let P=+loan.value,r=+loanRate.value/1200,n=+loanMonths.value,p=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;rloan.textContent='Rata miesięczna: '+money(p)}
function categoryTotals(type){return D.transactions.filter(x=>x.type===type).reduce((o,x)=>(o[x.category||'Inne']=(o[x.category||'Inne']||0)+ +x.amount,o),{})}function drawCharts(){let cats=categoryTotals('expense');if(catList)catList.innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([x,v])=>`<div class="budget"><span>${esc(x)}</span><div class="progress"><b style="width:${Math.min(100,v/(Math.max(...Object.values(cats))*1.1)*100)}%"></b></div><b>${money(v)}</b></div>`).join('')||'<p class="empty">Brak wydatków do pokazania</p>';for(let [id,values] of [['chart1',[stats().inc,stats().out]],['chart2',[Math.max(0,stats().balance),Math.max(0,stats().balance+stats().profit)]]]){let c=document.getElementById(id);if(!c)continue;let ctx=c.getContext('2d'),w=c.width=c.offsetWidth*devicePixelRatio,h=c.height=c.offsetHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);w=c.offsetWidth;h=c.offsetHeight;ctx.clearRect(0,0,w,h);let max=Math.max(...values,1);values.forEach((v,i)=>{let bh=v/max*(h-35);ctx.fillStyle=i?'#ff627d':'#1dd6a7';ctx.fillRect(50+i*(w/2),h-bh-20,w/2-90,bh);ctx.fillStyle='#8e9aae';ctx.fillText(i?'Wydatki':'Przychody',55+i*(w/2),h-5)})}}
function exportData(key,type){let o=D[key],content=type==='json'?JSON.stringify(o,null,2):o.length?Object.keys(o[0]).join(';')+'\n'+o.map(x=>Object.values(x).map(v=>JSON.stringify(v)).join(';')).join('\n'):'';download(content,`${key}.${type}`,type==='json'?'application/json':'text/csv');toast('Eksport gotowy')}function download(x,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function report(n,type){let s=stats(),txt=`Raport ${n}\nSaldo: ${money(s.balance)}\nPrzychody: ${money(s.inc)}\nWydatki: ${money(s.out)}\nZysk: ${money(s.profit)}`;if(type==='csv')download(txt,'raport-'+n+'.csv','text/csv');else{printArea.innerHTML=`<div class="invoice"><h1>${esc(D.settings.name)} — Raport ${esc(n)}</h1><pre>${esc(txt)}</pre><p>Wygenerowano: ${new Date().toLocaleString('pl-PL')}</p></div>`;window.print()}toast('Raport wygenerowany')}function backup(){download(JSON.stringify(D,null,2),'finora-backup.json','application/json');toast('Backup wyeksportowany')}function restore(el){let f=el.files[0];if(!f)return;let rd=new FileReader;rd.onload=()=>{try{let x=JSON.parse(rd.result);if(confirm('Import nadpisze wszystkie obecne dane. Kontynuować?')){D=x;save();toast('Backup przywrócony')}}catch{toast('Nieprawidłowy plik backupu')}};rd.readAsText(f)}function saveSettings(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));Object.assign(D.settings,{name:x.name,currency:x.currency,accent:x.accent});Object.assign(D.settings.company,{name:x.companyName,nip:x.nip,regon:x.regon,address:x.address,email:x.email,phone:x.phone,bank:x.bank});save();toast('Ustawienia zapisane')}
function openSearch(){modal('Globalna wyszukiwarka',`<input id="searchAll" autofocus placeholder="Szukaj transakcji, faktur, kontrahentów, kont, budżetów, celów..." oninput="doSearch(this.value)"><div id="searchResults" style="margin-top:15px" class="muted">Zacznij pisać.</div>`)}function doSearch(q){if(!q){searchResults.innerHTML='';return}let groups=[['Transakcje',D.transactions],['Faktury',D.invoices],['Kontrahenci',D.contacts],['Konta',D.accounts],['Budżety',D.budgets],['Cele',D.goals]],r=groups.flatMap(([n,a])=>a.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="budget"><b>${n}</b><span>${esc(x.name||x.number||x.description||x.category||'Wynik')}</span></div>`));searchResults.innerHTML=r.join('')||'<p>Brak wyników</p>'}
function render(){document.documentElement.style.setProperty('--accent',D.settings.accent);let b=document.getElementById('brand'),logo=D.settings.logo;b.innerHTML=logo?`<img src="${logo}" alt="logo" style="width:30px;height:30px;border-radius:10px;object-fit:cover"><span>${esc(D.settings.name)}</span>`:`<i>${esc(D.settings.logoLetter||D.settings.name.slice(0,1).toUpperCase())}</i><span>${esc(D.settings.name)}</span>`;document.title=D.settings.name;document.getElementById('nav').innerHTML=nav.map(x=>`<button class="${x===page?'active':''}" onclick="go('${x}')"><span>${icon(x)}</span>${x}</button>`).join('');pageTitle.textContent=page;let f={Dashboard:dashboard,Finanse:finances,Transakcje:transactionPage,Przychody:incomePage,Wydatki:expensePage,Budżety:budgets,Podatki:taxes,Faktury:invoices,Kontrahenci:contacts,'Analiza finansowa':analysis,Inwestycje:investments,Planowanie:planning,'Cele finansowe':goals,Raporty:reports,Kalendarz:calendar,Kalkulatory:calculators,Ustawienia:settings}[page];view.innerHTML=f();setTimeout(drawCharts,30)}
function readLogoFile(el){let f=el.files[0];if(!f)return;if(f.size>750000){toast('Logo jest za duże (maks. 750 KB)');return}let r=new FileReader;r.onload=()=>{D.settings.logo=r.result;save();toast('Logo zapisane')};r.readAsDataURL(f)}
function settings(){let s=D.settings,c=s.company;return `<div class="section-head"><div><h2>Ustawienia</h2><span class="muted">Dostosuj nazwę i identyfikację aplikacji.</span></div></div><div class="card"><form class="form" onsubmit="saveSettings(event)"><label>Nazwa aplikacji<input name="name" required maxlength="40" value="${esc(s.name)}"></label><label>Litera logo<input name="logoLetter" maxlength="3" value="${esc(s.logoLetter||'')}" placeholder="np. F"></label><label>Własne logo<input type="file" accept="image/*" onchange="readLogoFile(this)"><small class="muted">PNG/JPG/SVG, maks. 750 KB</small></label><div><span class="label">Obecne logo</span><div class="brand" style="margin-top:8px">${s.logo?`<img src="${s.logo}" style="width:34px;height:34px;object-fit:cover;border-radius:10px">`:`<i>${esc(s.logoLetter||s.name[0])}</i>`}</div><button type="button" class="btn danger" onclick="D.settings.logo='';save()">Usuń plik logo</button></div><label>Waluta<select name="currency">${['PLN','EUR','USD','GBP','CHF'].map(x=>`<option ${s.currency===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Kolor główny<input name="accent" type="color" value="${s.accent}"></label><label>Nazwa firmy<input name="companyName" value="${esc(c.name)}"></label><label>NIP<input name="nip" value="${esc(c.nip)}"></label><label>Adres<textarea name="address">${esc(c.address)}</textarea></label><label>Email<input type="email" name="email" value="${esc(c.email)}"></label><label>Telefon<input name="phone" value="${esc(c.phone)}"></label><label>Konto bankowe<input name="bank" value="${esc(c.bank)}"></label><div class="full"><button class="btn">Zapisz ustawienia</button></div></form></div><div class="card" style="margin-top:16px"><h3>Backup</h3><button class="btn soft" onclick="backup()">Eksportuj backup</button> <button class="btn" onclick="document.getElementById('restore').click()">Importuj backup</button><input id="restore" type="file" accept="application/json" style="display:none" onchange="restore(this)"></div>`}
function saveSettings(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));Object.assign(D.settings,{name:x.name,logoLetter:x.logoLetter.trim(),currency:x.currency,accent:x.accent});Object.assign(D.settings.company,{name:x.companyName,nip:x.nip,address:x.address,email:x.email,phone:x.phone,bank:x.bank});save();toast('Ustawienia zapisane')}
function loadDemo(){D={...fresh(),settings:{...fresh().settings,name:'Finora — DEMO'},accounts:[{id:'a1',name:'Konto firmowe',balance:24350,currency:'PLN',type:'bankowe',description:'Dane przykładowe'}],transactions:[{id:'t1',type:'income',amount:12000,date:date(),category:'Usługi',account:'a1',description:'Przykładowa usługa'},{id:'t2',type:'expense',amount:2300,date:date(),category:'Mieszkanie',account:'a1',description:'Przykładowy wydatek'}],budgets:[{id:'b1',name:'Budżet domowy',category:'Mieszkanie',limit:4000,period:'miesięczny'}],goals:[{id:'g1',name:'Poduszka finansowa',current:12000,target:30000,date:'2027-06-01'}],plans:[{id:'p1',name:'Rata leasingu',amount:950,date:new Date(Date.now()+86400000*12).toISOString().slice(0,10),category:'Transport',priority:'wysoki',recurrence:'miesięcznie'}],contacts:[],invoices:[],investments:[]};save();toast('Załadowano dane demonstracyjne')}
if(!D){D=fresh();render();modal('Witaj w Finora',`<p class="muted">Wybierz sposób rozpoczęcia pracy. Dane demonstracyjne są wyraźnie oznaczone jako przykładowe i możesz je usunąć w dowolnym momencie.</p><div class="form-actions"><button class="btn soft" onclick="save();closeModal();toast('Pusta aplikacja gotowa')">Rozpocznij pustą aplikację</button><button class="btn" onclick="loadDemo();closeModal()">Załaduj dane demonstracyjne</button></div>`)}else render();
</script></body></html>
